[www]
user = sos
group = sos
listen = 0.0.0.0:9000
; Necessário: APP_KEY, DB_* e outras variáveis vêm do env_file em runtime.
clear_env = no
pm = dynamic
pm.max_children = 4
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 2
pm.max_requests = 500
request_terminate_timeout = 180s
catch_workers_output = yes
decorate_workers_output = no
