# Homologação INDEPENDENTE: sem rede nem volume da produção.
# Uso: docker compose --env-file .env.homolog -f compose.homolog.yml up -d
name: sosmecanica-homolog
services:
  # Corrige a propriedade do volume publico na primeira inicializacao.
  # Executa apenas na homologacao, antes do PHP-FPM.
  storage-init:
    image: sosmecanica-app:${SOS_IMAGE_TAG:?Defina SOS_IMAGE_TAG}
    user: "0:0"
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        test -d /var/www/html/storage/app/public
        && chown 1000:1000 /var/www/html/storage/app/public
        && stat -c '%u:%g %a %n' /var/www/html/storage/app/public
    volumes:
      - homolog-storage:/var/www/html/storage
      - homolog-public:/var/www/html/storage/app/public
    networks: [homolog-net]
    security_opt: [no-new-privileges:true]
  app:
    image: sosmecanica-app:${SOS_IMAGE_TAG:?Defina SOS_IMAGE_TAG}
    restart: unless-stopped
    env_file: [.env.homolog]
    environment:
      APP_ENV: staging
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_DATABASE: sosmecanica_homolog
      DB_USERNAME: sos_homolog
      DB_PASSWORD: ${HOMOLOG_DB_PASSWORD:?Defina em .env.homolog}
      APP_URL: http://127.0.0.1:18080
    volumes:
      - homolog-storage:/var/www/html/storage
      - homolog-public:/var/www/html/storage/app/public
    depends_on:
      mysql: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}
    networks: [homolog-net]
    security_opt: [no-new-privileges:true]
  web:
    image: sosmecanica-web:${SOS_IMAGE_TAG:?Defina SOS_IMAGE_TAG}
    ports: ["127.0.0.1:18080:8080"]
    volumes:
      - homolog-public:/var/www/html/public/storage:ro
    depends_on: [app]
    networks: [homolog-net]
    security_opt: [no-new-privileges:true]
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${HOMOLOG_MYSQL_ROOT_PASSWORD:?Defina em .env.homolog}
      MYSQL_DATABASE: sosmecanica_homolog
      MYSQL_USER: sos_homolog
      MYSQL_PASSWORD: ${HOMOLOG_DB_PASSWORD:?Defina em .env.homolog}
    volumes:
      - homolog-mysql:/var/lib/mysql
    networks: [homolog-net]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -uroot --silent']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
networks:
  homolog-net:
    driver: bridge
volumes:
  homolog-mysql:
  homolog-storage:
  homolog-public:
