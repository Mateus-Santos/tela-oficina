name: SOS Mecanica - Performance fase 1

on:
  pull_request:
    branches: [development, master]
    paths:
      - 'docker/production/nginx.conf'
      - 'docker/production/www.conf'
      - 'resources/views/layouts/layout.blade.php'
      - 'scripts/performance/**'
      - 'tests/performance/**'
      - '.github/workflows/ci-performance.yml'
  push:
    branches: [development, master]
    paths:
      - 'docker/production/nginx.conf'
      - 'docker/production/www.conf'
      - 'resources/views/layouts/layout.blade.php'
      - 'scripts/performance/**'
      - 'tests/performance/**'
      - '.github/workflows/ci-performance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Testar invariantes de layout e cache
        run: python3 -m unittest discover -s tests/performance -p 'test_*.py' -v
      - name: Validar sintaxe dos scripts de medicao
        run: bash -n scripts/performance/medir_vps.sh scripts/performance/benchmark_http.sh
      - name: Validar config PHP-FPM em Docker isolado do GitHub runner
        shell: bash
        run: |
          set -Eeuo pipefail
          TEMP="$(mktemp -d)"
          trap 'rm -rf -- "$TEMP"' EXIT
          # A imagem publica possui www-data; na imagem real o usuario e sos.
          sed -e 's/^user = sos$/user = www-data/' -e 's/^group = sos$/group = www-data/' \
            docker/production/www.conf > "$TEMP/www.conf"
          docker run --rm \
            -v "$TEMP/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro" \
            php:8.5-fpm-alpine php-fpm -tt
