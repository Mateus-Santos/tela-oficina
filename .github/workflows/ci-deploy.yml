name: Testes do deploy automatizado

on:
  pull_request:
    branches: [development, master]
    paths:
      - scripts/deploy.sh
      - scripts/production/database_release.sh
      - scripts/production/deploy_release.sh
      - .github/workflows/deploy.yml
      - .github/workflows/ci-deploy.yml
      - tests/deploy/**
  push:
    branches: [development, master]
    paths:
      - scripts/deploy.sh
      - scripts/production/database_release.sh
      - scripts/production/deploy_release.sh
      - .github/workflows/deploy.yml
      - .github/workflows/ci-deploy.yml
      - tests/deploy/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Testar backup, migrations e bloqueios (Docker simulado)
        shell: bash
        run: bash tests/deploy/test_deploy.sh
