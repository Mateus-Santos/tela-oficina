name: sosmecanica deployment

on:
  push:
    branches: [master]

  pull_request:
    branches: [master]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repo Checkout
        uses: actions/checkout@v4

      - name: Build
        run: echo "Building the app"

  deploy-production:
    # Só roda em push direto na master ou disparo manual — NUNCA em pull_request
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    environment:
      name: production
      url: ${{ vars.URL }}

    needs: build

    steps:
      - name: Repo Checkout
        uses: actions/checkout@v4

      - name: Start SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Configure known_hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SERVER_SSH_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Create Exclude File
        run: |
          echo ".git/" > .rsync-exclude
          echo "node_modules/" >> .rsync-exclude
          echo "storage/" >> .rsync-exclude
          echo ".env" >> .rsync-exclude
          echo "vendor/" >> .rsync-exclude
          echo "public/build/" >> .rsync-exclude
          git ls-files --ignored --exclude-standard -o >> .rsync-exclude

      - name: Deploy files
        run: |
          rsync -avz \
            --delete \
            --exclude-from='.rsync-exclude' \
            --update \
            -e "ssh -p ${{ vars.REMOTE_PORT }} -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes" \
            ./ \
            ${{ vars.REMOTE_USER }}@${{ vars.REMOTE_HOST }}:${{ vars.TARGET }}/

      - name: Deploy application
        run: |
          ssh \
            -p ${{ vars.REMOTE_PORT }} \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o StrictHostKeyChecking=yes \
            ${{ vars.REMOTE_USER }}@${{ vars.REMOTE_HOST }} << 'EOF'

          set -e

          cd ${{ vars.TARGET }}

          echo "Building Docker images..."
          docker compose build

          echo "Installing Composer dependencies..."
          docker compose run --rm laravel.sosmecanica composer install \
            --no-interaction \
            --prefer-dist \
            --optimize-autoloader

          echo "Installing frontend dependencies..."
          docker compose run --rm laravel.sosmecanica npm ci

          echo "Building frontend assets..."
          docker compose run --rm laravel.sosmecanica npm run build

          echo "Running database migrations..."
          docker compose run --rm laravel.sosmecanica php artisan migrate --force

          echo "Recreating containers..."
          docker compose up -d --force-recreate

          echo "Optimizing Laravel..."
          docker compose exec -T laravel.sosmecanica php artisan optimize

          echo "Deployment completed successfully."
          EOF