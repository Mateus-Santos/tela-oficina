name: sosmecanica deployment

on:
  push:
    branches: [master]

  pull_request:
    branches: [master]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repo Checkout
        uses: actions/checkout@v4

      - name: Build
        run: echo "Building the app"

  deploy-production:
    runs-on: ubuntu-latest

    environment:
      name: production
      url: ${{ vars.URL }}

    needs: build

    steps:
      - name: Repo Checkout
        uses: actions/checkout@v4

      - name: Create Exclude File
        run: |
          echo ".git/" > .rsync-exclude
          echo "node_modules/" >> .rsync-exclude
          echo "storage/" >> .rsync-exclude
          echo ".env" >> .rsync-exclude
          echo "vendor/" >> .rsync-exclude
          echo "public/build/" >> .rsync-exclude
          git ls-files --ignored --exclude-standard -o >> .rsync-exclude

      - name: Deploy files
        uses: easingthemes/ssh-deploy@v2.1.5
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          ARGS: "-avz --exclude-from='.rsync-exclude' --update"
          SOURCE: "./"
          REMOTE_HOST: ${{ vars.REMOTE_HOST }}
          REMOTE_USER: ${{ vars.REMOTE_USER }}
          REMOTE_PORT: ${{ vars.REMOTE_PORT }}
          TARGET: ${{ vars.TARGET }}

      - name: Deploy application
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.REMOTE_HOST }}
          username: ${{ vars.REMOTE_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ vars.REMOTE_PORT }}

          script: |
            set -e

            cd ${{ vars.TARGET }}

            echo "Building Docker containers..."
            docker compose up -d --build

            echo "Installing Composer dependencies..."
            docker compose exec -T laravel.sosmecanica composer install \
              --no-interaction \
              --prefer-dist \
              --optimize-autoloader

            echo "Running database migrations..."
            docker compose exec -T laravel.sosmecanica php artisan migrate --force

            echo "Optimizing Laravel..."
            docker compose exec -T laravel.sosmecanica php artisan optimize

            echo "Deployment completed successfully."