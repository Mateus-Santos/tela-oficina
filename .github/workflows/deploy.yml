name: sosmecanica deployment

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-production:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    environment:
      name: production
      url: ${{ vars.URL }}

    steps:
      - name: Repo Checkout
        uses: actions/checkout@v4

      - name: Start SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Configure known_hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.SERVER_SSH_HOST_KEY }}" > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies & Build
        run: |
          npm ci
          npm run build

      - name: Create Exclude File
        run: |
          echo ".git/" > .rsync-exclude
          echo "node_modules/" >> .rsync-exclude
          echo "storage/" >> .rsync-exclude
          echo ".env" >> .rsync-exclude
          echo "vendor/" >> .rsync-exclude

          git ls-files --ignored --exclude-standard -o >> .rsync-exclude

          # Garante que public/build/ nunca seja ignorado pelo rsync
          sed -i '/public\/build/d' .rsync-exclude

      - name: Deploy files
        run: |
          rsync -avz \
            --delete \
            --exclude-from='.rsync-exclude' \
            --update \
            -e "ssh -p ${{ vars.REMOTE_PORT }} -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes" \
            ./ \
            ${{ vars.REMOTE_USER }}@${{ vars.REMOTE_HOST }}:${{ vars.TARGET }}/

      - name: Deploy application
        run: |
          ssh \
            -p ${{ vars.REMOTE_PORT }} \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o StrictHostKeyChecking=yes \
            ${{ vars.REMOTE_USER }}@${{ vars.REMOTE_HOST }} << 'EOF'

          set -e

          cd ${{ vars.TARGET }}

          echo "========================================"
          echo "BUILDING DOCKER IMAGES"
          echo "========================================"

          docker compose build

          echo "========================================"
          echo "INSTALLING COMPOSER DEPENDENCIES"
          echo "========================================"

          docker compose run --rm laravel.sosmecanica composer install \
            --no-interaction \
            --prefer-dist \
            --optimize-autoloader

          echo "========================================"
          echo "RUNNING DATABASE MIGRATIONS"
          echo "========================================"

          docker compose run --rm laravel.sosmecanica php artisan migrate --force

          echo "========================================"
          echo "RECREATING CONTAINERS"
          echo "========================================"

          docker compose up -d --force-recreate

          echo "========================================"
          echo "DOCKER CONTAINERS"
          echo "========================================"

          docker compose ps

          echo "========================================"
          echo "CLEARING LARAVEL CACHE"
          echo "========================================"

          docker compose exec -T laravel.sosmecanica php artisan optimize:clear

          echo "========================================"
          echo "CREATING STORAGE LINK"
          echo "========================================"

          docker compose exec -T laravel.sosmecanica php artisan storage:link --force

          echo "========================================"
          echo "VALIDATING STORAGE LINK"
          echo "========================================"

          docker compose exec -T laravel.sosmecanica sh -c '
            if [ ! -L public/storage ]; then
              echo "ERROR: public/storage não é um link simbólico."
              exit 1
            fi

            echo "Link encontrado:"
            ls -la public/storage

            echo ""
            echo "Destino do link:"
            readlink public/storage

            echo ""
            echo "Verificando destino..."

            if [ ! -d public/storage ]; then
              echo "ERROR: o destino de public/storage não existe."
              exit 1
            fi

            echo "Storage link validado com sucesso."
          '

          echo "========================================"
          echo "CHECKING STORAGE DIRECTORY"
          echo "========================================"

          docker compose exec -T laravel.sosmecanica sh -c '
            if [ ! -d storage/app/public ]; then
              echo "ERROR: storage/app/public não existe."
              exit 1
            fi

            echo "storage/app/public encontrado."

            ls -la storage/app/public
          '

          echo "========================================"
          echo "OPTIMIZING LARAVEL"
          echo "========================================"

          docker compose exec -T laravel.sosmecanica php artisan optimize

          echo "========================================"
          echo "DEPLOYMENT COMPLETED SUCCESSFULLY"
          echo "========================================"

          EOF
