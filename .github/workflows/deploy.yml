name: SOS Mecanica - Validacao e Deploy V4
run-name: 'SOS Mecanica / ${{ inputs.modo || ''CI'' }} / ${{ github.ref_name }}'

# PR valida codigo; publicar continua EXCLUSIVAMENTE manual.
on:
  pull_request:
    branches: [development, master]
  workflow_dispatch:
    inputs:
      modo:
        description: 'validar = construir e guardar imagens no GHCR; publicar = usar essas imagens, sem rebuild'
        required: true
        type: choice
        default: validar
        options:
          - validar
          - publicar
      confirmacao:
        description: 'Exclusivo de publicar: digite PUBLICAR apos homologacao e backup'
        required: false
        type: string

permissions:
  contents: read

# Concorrencia aplica-se apenas ao deploy, sem travar checagens de PR.
jobs:
  qualidade:
    name: Verificacoes de PR - sem deploy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: testing
          MYSQL_USER: ci_testes
          MYSQL_PASSWORD: senha_temporaria_ci
          MYSQL_ROOT_PASSWORD: root_temporario_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: testing
      DB_USERNAME: ci_testes
      DB_PASSWORD: senha_temporaria_ci
      DATABASE_URL: ''
      CACHE_STORE: array
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Scripts e testes de deploy (Docker simulado)
        run: |
          bash -n scripts/deploy.sh scripts/production/deploy_release.sh scripts/production/database_release.sh
          bash tests/deploy/test_deploy.sh
      - name: Testes de performance, layout e assets
        run: |
          python3 -m unittest discover -s tests/performance -p 'test_*.py' -v
          bash -n scripts/performance/medir_vps.sh scripts/performance/benchmark_http.sh
      - name: Verificar configuracao PHP-FPM em Docker isolado
        shell: bash
        run: |
          set -Eeuo pipefail
          TEMP="$(mktemp -d)"
          trap 'rm -rf -- "$TEMP"' EXIT
          sed -e 's/^user = sos$/user = www-data/' -e 's/^group = sos$/group = www-data/' \
            docker/production/www.conf > "$TEMP/www.conf"
          docker run --rm \
            -v "$TEMP/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro" \
            php:8.5-fpm-alpine php-fpm -tt
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Preparar PHP/Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
      - name: Conferir Composer e build frontend
        run: |
          composer validate --no-check-publish
          npm ci
          npm run build
      - name: Instalar dependencias PHP para regressao
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Executar testes Laravel em MySQL isolado
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$APP_ENV" = "testing"
          test "$DB_DATABASE" = "testing"
          test "$DB_HOST" = "127.0.0.1"
          test "$DB_USERNAME" = "ci_testes"
          export APP_KEY="$(php -r 'echo "base64:".base64_encode(random_bytes(32));')"
          test ! -e .env
          printf 'APP_ENV=testing\n' > .env
          trap 'rm -f -- .env' EXIT
          php artisan test --no-ansi --display-warnings --fail-on-warning

      - name: Auditar dependencias Composer e NPM
        id: audit
        shell: bash
        run: |
          set +e
          python3 scripts/performance/auditar_dependencias.py --live \
            --saida "$RUNNER_TEMP/P03_AUDITORIA_DEPENDENCIAS.md"
          resultado=$?
          echo "resultado=$resultado" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Anexar auditoria de seguranca
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p03-auditoria-dependencias
          path: ${{ runner.temp }}/P03_AUDITORIA_DEPENDENCIAS.md
          if-no-files-found: warn
          retention-days: 14
      - name: Bloquear PR com vulnerabilidades ou falha da auditoria
        if: always()
        env:
          AUDIT_RESULTADO: ${{ steps.audit.outputs.resultado }}
        run: |
          [[ "$AUDIT_RESULTADO" == 0 ]] || {
            echo 'Auditoria de dependencias reprovou. Veja o artefato P03.' >&2
            exit 1
          }

  release:
    permissions:
      contents: read
      packages: write
    concurrency:
      group: sosmecanica-docker-production
      cancel-in-progress: false
    # Permite validar na feature branch; publicar em outra branch falha explicitamente no pre-check.
    if: github.event_name == 'workflow_dispatch' && (inputs.modo == 'validar' || inputs.modo == 'publicar')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Validacao nao depende de aprovacao/segredos do ambiente production.
    environment:
      name: ${{ inputs.modo == 'publicar' && 'production' || 'docker-validation' }}
      url: https://jaimeautomotivo.com.br

    env:
      TAG: ${{ github.sha }}
      APP_REPO: ghcr.io/mateus-santos/sosmecanica-app
      WEB_REPO: ghcr.io/mateus-santos/sosmecanica-web
      REMOTE_USER: ${{ vars.REMOTE_USER }}
      REMOTE_HOST: ${{ vars.REMOTE_HOST }}
      REMOTE_PORT: ${{ vars.REMOTE_PORT }}
      PROJECT_DIR: ${{ vars.TARGET }}
      DEPLOY_DIR: /home/mateus/deploy/sosmecanica

    steps:
      - name: Conferir modo, branch e confirmacao
        env:
          MODO: ${{ inputs.modo }}
          CONFIRMACAO: ${{ inputs.confirmacao }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$MODO" == publicar ]]; then
            [[ "$GITHUB_REF" == refs/heads/master ]]
            [[ "$CONFIRMACAO" == PUBLICAR ]]
            [[ "$PROJECT_DIR" == /var/www/sos-mecanica || "$PROJECT_DIR" == /var/www/sos-mecanica/ ]]
            [[ -n "$REMOTE_USER" && -n "$REMOTE_HOST" && -n "$REMOTE_PORT" ]]
            [[ "$REMOTE_PORT" =~ ^[0-9]+$ ]]
          fi
          echo "Modo: $MODO | Commit: $TAG"

      - name: Checkout do commit
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Verificar script de release
        run: |
          set -euo pipefail
          bash -n scripts/production/deploy_release.sh
          bash -n scripts/production/database_release.sh
          bash -n scripts/deploy.sh
          test -f tests/deploy/test_deploy.sh
          test -f compose.prod.yml
          test -f docker/production/Dockerfile.app
          test -f docker/production/Dockerfile.php-base
          test -f docker/production/Dockerfile.web

      - name: Autenticar no GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Testar deploy sem acesso a producao
        if: inputs.modo == 'validar'
        run: bash tests/deploy/test_deploy.sh

      - name: Configurar Docker Buildx
        if: inputs.modo == 'validar'
        uses: docker/setup-buildx-action@v4
        with:
          # Limita concorrencia de compilacao no runner, sem consumir CPU da VPS.
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2

      - name: Verificar se este commit ja foi construido
        if: inputs.modo == 'validar'
        id: existing
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$APP_REPO:$TAG" >/dev/null 2>&1 \
             && docker buildx imagetools inspect "$WEB_REPO:$TAG" >/dev/null 2>&1; then
            echo 'Imagens existentes no GHCR: nao recompilar.'
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Pelo menos uma imagem ainda precisa ser construida.'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi

      # Imagem-base PHP compilada somente quando o Dockerfile.php-base muda.
      # O SHA do arquivo gera uma tag imutavel e compartilhavel entre releases.
      - name: Identificar imagem-base PHP
        if: inputs.modo == 'validar' && steps.existing.outputs.ready != 'true'
        id: base
        run: |
          set -euo pipefail
          HASH="$(sha256sum docker/production/Dockerfile.php-base | cut -c1-20)"
          echo "image=ghcr.io/mateus-santos/sosmecanica-php-base:php85-$HASH" >> "$GITHUB_OUTPUT"

      - name: Conferir existencia da base PHP
        if: inputs.modo == 'validar' && steps.existing.outputs.ready != 'true'
        id: base_exists
        env:
          PHP_BASE_IMAGE: ${{ steps.base.outputs.image }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$PHP_BASE_IMAGE" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo 'Base PHP existente: nao recompilar extensoes.'
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
            echo 'Primeira compilacao desta versao PHP-base.'
          fi

      - name: Construir base PHP somente se necessario
        if: inputs.modo == 'validar' && steps.existing.outputs.ready != 'true' && steps.base_exists.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/production/Dockerfile.php-base
          platforms: linux/amd64
          push: true
          tags: ${{ steps.base.outputs.image }}
          labels: |
            org.opencontainers.image.source=https://github.com/Mateus-Santos/tela-oficina
            org.opencontainers.image.description=Base PHP 8.5 e extensoes SOS Mecanica
          build-args: |
            PHP_BUILD_JOBS=1

      # Somente Composer + Vite + codigo mudam a cada nova release.
      # Sem exportar cache intermediario gigante para o GitHub Actions.
      - name: Construir e armazenar Laravel
        if: inputs.modo == 'validar' && steps.existing.outputs.ready != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/production/Dockerfile.app
          platforms: linux/amd64
          push: true
          tags: ${{ env.APP_REPO }}:${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/Mateus-Santos/tela-oficina
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            PHP_BASE_IMAGE=${{ steps.base.outputs.image }}

      - name: Construir e armazenar Nginx
        if: inputs.modo == 'validar' && steps.existing.outputs.ready != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/production/Dockerfile.web
          platforms: linux/amd64
          push: true
          tags: ${{ env.WEB_REPO }}:${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/Mateus-Santos/tela-oficina
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            APP_IMAGE=${{ env.APP_REPO }}:${{ env.TAG }}

      - name: Conferir imagens construidas
        if: inputs.modo == 'validar'
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$APP_REPO:$TAG" >/dev/null
          docker buildx imagetools inspect "$WEB_REPO:$TAG" >/dev/null
          echo "VALIDADO: $TAG"
          echo 'As imagens foram armazenadas no GHCR; nao houve acesso a VPS.'

      # Roda tambem em publicar: um artefato sem codecs nunca chega a VPS.
      - name: Validar conversao de imagem no container publicado
        run: |
          set -euo pipefail
          docker pull "$APP_REPO:$TAG"
          docker run --rm --entrypoint php "$APP_REPO:$TAG" \
            /var/www/html/scripts/production/verificar_imagens.php

      # Publicar NAO executa npm ci, composer install, docker build ou docker save.
      - name: Configurar chave SSH
        if: inputs.modo == 'publicar'
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Configurar host conhecido
        if: inputs.modo == 'publicar'
        env:
          HOST_KEY: ${{ secrets.SERVER_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          test -n "$HOST_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Conferir versao aprovada no GHCR
        if: inputs.modo == 'publicar'
        run: |
          set -euo pipefail
          docker manifest inspect "$APP_REPO:$TAG" >/dev/null
          docker manifest inspect "$WEB_REPO:$TAG" >/dev/null
          echo "Imagens aprovadas localizadas: $TAG"

      - name: Enviar somente configuracao e script
        if: inputs.modo == 'publicar'
        run: |
          set -euo pipefail
          SSH_OPTS=(-p "$REMOTE_PORT" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          ssh "${SSH_OPTS[@]}" "$REMOTE_USER@$REMOTE_HOST" \
            "mkdir -p '$DEPLOY_DIR/releases/$TAG'"
          scp -P "$REMOTE_PORT" -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            compose.prod.yml scripts/production/deploy_release.sh \
            scripts/production/database_release.sh \
            "$REMOTE_USER@$REMOTE_HOST:$DEPLOY_DIR/releases/$TAG/"

      - name: Publicar imagens existentes na VPS com rollback
        if: inputs.modo == 'publicar'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SSH_OPTS=(-p "$REMOTE_PORT" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          # Token temporario vai APENAS por SSH/stdin, nunca no comando ou em arquivos do projeto.
          printf '%s\n' "$GHCR_TOKEN" | ssh "${SSH_OPTS[@]}" \
            "$REMOTE_USER@$REMOTE_HOST" \
            "bash '$DEPLOY_DIR/releases/$TAG/deploy_release.sh' '$TAG' '$GITHUB_ACTOR'"
