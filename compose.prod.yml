# Primeiro corte de producao: EXECUTA EM PARALELO, nao recria MySQL e nem o Sail.
# Validar o nome da rede existente ANTES de usar: docker network ls
# Porta 18081 permite smoke test sem conflitar com 8080 atual.
name: sosmecanica-prod
services:
  app:
    image: sosmecanica-app:${SOS_IMAGE_TAG:?Defina SOS_IMAGE_TAG para o commit homologado}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: mysql
    volumes:
      - ./storage:/var/www/html/storage
    networks: [app-net, mysql-existente]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m

  web:
    image: sosmecanica-web:${SOS_IMAGE_TAG:?Defina SOS_IMAGE_TAG para o commit homologado}
    restart: unless-stopped
    ports:
      - "127.0.0.1:18081:8080"
    volumes:
      - ./storage/app/public:/var/www/html/public/storage:ro
    depends_on:
      - app
    networks: [app-net]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=32m
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  app-net:
    driver: bridge
  mysql-existente:
    external: true
    name: sos-mecanica_sail
